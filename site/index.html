<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Firefly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: one-screen console. Chat on the left, the living graph in the middle, the brain's settings on the right
   (Team, Skills, JEV, Memory, Models, Tasks). Phones stack graph above tabbed panels. Single dark theme on purpose:
   an Obsidian-style vault. */
:root{
  --bg:#1e1e1e; --panel:#181818; --slab:#252525; --line:#2e2e2e; --line2:#3a3a3a;
  --ink:#dadada; --mute:#9a9a9a; --faint:#666; --accent:#8b6cef; --glow:#a68af9;
  --up:#4fbf8b; --down:#e5636f; --warn:#d9a94e;
  --f-ui:"Inter","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header.top{display:flex;align-items:center;gap:12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.name{font-weight:600;font-size:15px;background:none;border:0;border-bottom:1px dashed transparent;padding:2px 0;min-width:0;width:auto;max-width:42vw}
.name:hover,.name:focus{border-bottom-color:var(--line2);outline:none}
.pills{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{font-size:12px;color:var(--mute);background:var(--slab);border-radius:5px;padding:5px 9px;display:flex;gap:6px;align-items:center;white-space:nowrap;border:0}
.pill b{color:var(--ink);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}.dot.on{background:var(--up)}.dot.warn{background:var(--warn)}
main{display:grid;grid-template-columns:minmax(290px,360px) minmax(0,1fr) minmax(300px,380px);min-height:0}
#chat{min-height:0}
#graph{min-width:0;min-height:0}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;border-radius:5px;padding:6px 8px;font-size:12.5px;color:var(--mute);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--slab);color:var(--ink)}
.view{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.view[hidden]{display:none}
h3{margin:0 0 6px;font-size:14px;font-weight:600}
.sec{border-bottom:1px solid var(--line);padding-bottom:14px}
.sub{font-size:12px;color:var(--faint)}
.row{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.sw{flex:none;width:12px;height:12px;border-radius:3px;margin-top:4px}
.grow{flex:1;min-width:0}
form.f{display:grid;gap:8px;margin-top:8px}
label{display:grid;gap:3px;font-size:12px;color:var(--mute)}
input,textarea,select{background:var(--slab);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;font-size:13px;width:100%;min-width:0;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
.btn{justify-self:start;border:0;background:var(--accent);color:#fff;border-radius:6px;padding:7px 13px;font-size:13px;font-weight:500;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--mute);padding:4px 9px;font-size:12px;font-weight:400}
.btn[disabled]{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;color:var(--mute);background:var(--slab);border-radius:4px;padding:2px 7px}
.chk{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink)}
.chk input{width:auto}
.bar{height:8px;background:#2c2c2c;border-radius:4px;overflow:hidden;display:flex;margin-top:5px}
.bar i{display:block;height:100%}
.grade{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.grade button{background:none;border:1px solid var(--line2);border-radius:5px;color:var(--mute);padding:3px 8px;font-size:11.5px;cursor:pointer}
.grade button[aria-pressed="true"]{color:#fff;border-color:transparent}
details summary{cursor:pointer;color:var(--glow);font-size:12px;margin-top:4px}
pre.res{white-space:pre-wrap;font:12.5px/1.5 var(--f-ui);color:#cfcfcf;margin:6px 0 0}
.empty{color:var(--mute);font-size:13px}
.err{color:var(--down);font-size:12px}
.mtabs{display:none}
@media (max-width:1100px){main{grid-template-columns:minmax(280px,340px) minmax(0,1fr)} .side{display:none} .app.side-open .side{display:flex;position:fixed;right:0;top:0;bottom:0;width:min(400px,94vw);z-index:20;box-shadow:-20px 0 40px #000a} #side-btn{display:flex}}
@media (min-width:1101px){#side-btn{display:none}}
@media (max-width:760px){
  body{overflow:auto}.app{height:auto;min-height:100%}
  main{display:flex;flex-direction:column}
  #graph{height:46vh;min-height:300px;order:-1}
  #chat,.side{display:none}
  .app[data-m="chat"] #chat{display:flex;height:64vh}.app[data-m="side"] .side{display:flex;position:static;width:auto;box-shadow:none;min-height:64vh}
  .mtabs{display:flex;position:sticky;bottom:0;gap:6px;background:var(--panel);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .mtabs button{flex:1;background:var(--slab);border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--mute);font-size:13px}
  .mtabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
  #side-btn{display:none}
}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#262626;border:1px solid var(--line-2,#3a3a3a);border-radius:8px;padding:9px 14px;font-size:13px;color:var(--ink,#dadada);box-shadow:0 8px 24px #0008;transition:.2s;z-index:50;max-width:min(520px,calc(100vw - 32px))}
.savings{margin-top:10px;padding:10px 12px;border:1px solid var(--line,#2e2e2e);border-radius:10px;font-size:12.5px;color:var(--mute,#9a9a9a)}.savings b{color:var(--glow,#a68af9);font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0)}
.proj{background:var(--slab,#252525);border:1px solid var(--line,#2e2e2e);border-radius:6px;color:var(--ink,#dadada);padding:5px 8px;font:inherit;font-size:12.5px;max-width:180px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

/* ============ Firefly ============
   A notes-app workspace, done properly: a ribbon, a sidebar (crew in rank order, then memories), the graph in the
   middle, the crew channel on the right, a status line. Flat, dark, precise. The graph area is the night sky the
   crew's charts float in. One accent (violet); each crew member keeps its own colour. */
:root{
  --bg:#0e0f12; --p1:#17181b; --p2:#1c1d21; --p3:#232428; --hover:rgba(255,255,255,.055); --sel:rgba(139,124,246,.16);
  --line:#26282d; --line2:#33363c; --ink:#dcdde0; --mute:#9a9da4; --faint:#6c7078; --accent:#8b7cf6; --glow:#8b7cf6;
  --up:#5cc98f; --down:#e5636f; --warn:#d9a94e; --slab:#232428; --bk-bg:var(--bg);
  --f-ui:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:13px/1.5 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:rgba(139,124,246,.3)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:1px}
.app{height:100dvh;display:grid;grid-template-rows:40px minmax(0,1fr) 24px;min-width:0}
main{display:grid;grid-template-columns:44px 248px minmax(0,1fr) 368px;grid-template-rows:minmax(0,1fr);min-height:0;min-width:0;position:relative}
.rail{grid-column:1;grid-row:1}.explorer{grid-column:2;grid-row:1}#graph{grid-column:3;grid-row:1}#chat{grid-column:4;grid-row:1}

/* title bar */
header.top{display:flex;align-items:center;gap:12px;padding:0 10px 0 14px;background:var(--p1);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.brand-mark{display:grid;place-items:center;color:var(--accent)}.brand-mark svg{width:16px;height:16px}
.brand small{display:none}
.name{font:13px var(--f-ui);color:var(--mute);background:none;border:0;border-left:1px solid var(--line2);border-radius:0;padding:2px 0 2px 12px;width:160px;max-width:22vw}
.name:focus{color:var(--ink);outline:none}
header.top:has(.proj:not([hidden])) .name{display:none}
.proj{background:var(--p2);border:1px solid var(--line2);border-radius:6px;color:var(--ink);padding:3px 8px;font-size:12.5px;max-width:190px}
.pills{display:flex;align-items:center;gap:2px;margin-left:auto;flex-wrap:nowrap}
.pill{display:flex;align-items:center;gap:6px;background:none;border:0;border-radius:6px;padding:4px 9px;font-size:12px;color:var(--mute);white-space:nowrap}
.pill b{color:var(--ink);font-weight:500}
button.pill{cursor:pointer}button.pill:hover{background:var(--hover);color:var(--ink)}
#side-btn{display:flex!important}
kbd{font:11px var(--f-ui);color:var(--faint);background:var(--p2);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}.dot.on{background:var(--up)}.dot.warn{background:var(--warn)}

/* ribbon */
.rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;background:var(--p1);border-right:1px solid var(--line)}
.rail button{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--faint);cursor:pointer}
.rail svg{width:18px;height:18px}
.rail button:hover{background:var(--hover);color:var(--ink)}.rail button.active,.rail button[aria-pressed=true]{color:var(--ink)}
.rail .rail-bottom{margin-top:auto}

/* sidebar: crew in rank order, then memories */
.explorer{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--p1);border-right:1px solid var(--line);padding:10px 8px}
.ex-head{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 6px;font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:.02em}
.ex-head span{font-weight:400;color:var(--faint)}
.ex-list{display:flex;flex-direction:column;gap:1px;flex:none;margin-bottom:10px}
.ex-list.grow{flex:1;min-height:0;overflow:auto;margin-bottom:0}
.ex-list button{display:flex;align-items:center;gap:8px;width:100%;min-width:0;background:none;border:0;border-radius:5px;padding:5px 8px;text-align:left;font-size:13px;color:var(--ink);cursor:pointer}
.ex-list button:hover{background:var(--hover)}.ex-list button.selected{background:var(--sel)}
.ex-list b{font-weight:400;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-list small{color:var(--faint);font-size:11.5px;white-space:nowrap}
.ex-list i{flex:none;width:8px;height:8px;border-radius:50%}
.ex-list .rk{flex:none;width:14px;color:var(--faint);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.ex-list i.doc{width:10px;height:12px;border-radius:2px;border:1px solid var(--faint);background:none}
.ex-list button:hover i.doc{border-color:var(--mute)}

/* the graph */
#graph{position:relative;min-width:0;min-height:0;overflow:hidden;background:#000}
.graph-head{display:none}.canvas-corner{display:none}
.graph-modes{position:absolute;z-index:2;top:12px;right:12px;display:flex;gap:2px;padding:3px;background:var(--p1);border:1px solid var(--line2);border-radius:7px}
.graph-modes button{background:none;border:0;border-radius:5px;padding:3px 10px;font-size:12px;color:var(--mute);cursor:pointer}
.graph-modes button:hover{color:var(--ink)}.graph-modes button[aria-pressed=true]{background:var(--p3);color:var(--ink)}
.graph-foot{position:absolute;z-index:2;left:12px;bottom:12px;display:flex;gap:2px;padding:3px;background:var(--p1);border:1px solid var(--line2);border-radius:7px}
.graph-foot button{background:none;border:0;border-radius:5px;padding:3px 10px;font-size:12px;color:var(--mute);cursor:pointer}
.graph-foot button:hover{background:var(--hover);color:var(--ink)}
#graph .bk-zoom{right:12px;bottom:12px;gap:0;flex-direction:row;padding:3px;background:var(--p1);border:1px solid var(--line2);border-radius:7px}
#graph .bk-zoom button{width:26px;height:24px;border:0;border-radius:5px;background:none;color:var(--mute);font-size:14px}
#graph .bk-zoom button:hover{background:var(--hover);color:var(--ink)}
#graph .bk-tip{background:var(--p2);border:1px solid var(--line2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.45);color:var(--ink);font-size:12.5px}
#graph .bk-tip small{color:var(--mute)}
#graph .bk-note{top:52px;right:12px;bottom:52px;width:min(460px,calc(100% - 24px));background:var(--p1);border:1px solid var(--line2);border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#graph .bk-note header{border-color:var(--line)}#graph .bk-note header b{font-weight:600}#graph .bk-note header button{border-color:var(--line2);color:var(--mute);border-radius:5px}
#graph .bk-nb{color:var(--ink);font-size:14px;line-height:1.7}#graph .bk-nb h1{font-size:20px}#graph .bk-nb h1,#graph .bk-nb h2,#graph .bk-nb h3{font-weight:600;color:#ececee}
#graph .bk-nb a{color:var(--accent);border-bottom-color:rgba(139,124,246,.4)}#graph .bk-nb code{background:var(--p3)}#graph .bk-nb th,#graph .bk-nb td{border-color:var(--line)}

/* crew channel */
#chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--p1);border-left:1px solid var(--line);overflow:hidden}
#chat::before{content:"Crew";display:block;padding:10px 14px;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--mute);border-bottom:1px solid var(--line)}
#chat .bk-msgs{padding:14px;gap:14px}
#chat .bk-m{grid-template-columns:10px minmax(0,1fr)!important;gap:9px;font-size:13px}
#chat .bk-m i{width:8px;height:8px;border-radius:50%;margin-top:6px}
#chat .bk-m b{font-size:12.5px;font-weight:600}#chat .bk-m small{color:var(--faint);font-size:11.5px}
#chat .bk-m div.t{color:var(--ink);line-height:1.6;margin-top:2px}
#chat .bk-m.wait div.t{color:var(--faint)}
#chat .bk-welcome{margin:auto 0;padding:0 4px}
#chat .bk-welcome .welcome-index{display:none}
#chat .bk-welcome h2{font-size:18px;font-weight:600;margin:0 0 8px;color:#ececee}
#chat .bk-welcome p{color:var(--mute);font-size:13px;line-height:1.65;margin:0 0 8px}
#chat .bk-to{padding:8px 10px 0;gap:2px;border-top:1px solid var(--line)}
#chat .bk-to button{font-size:12px;padding:3px 8px;border-radius:5px;color:var(--mute)}
#chat .bk-to button:hover{background:var(--hover)}#chat .bk-to button[aria-pressed=true]{background:var(--p3);color:var(--ink)}
#chat .bk-in{padding:8px 10px 10px;gap:6px}
#chat .bk-in textarea{background:var(--p2);border:1px solid var(--line2);border-radius:7px;font-size:13px;color:var(--ink);min-height:40px;padding:9px 11px}
#chat .bk-in textarea:focus{outline:none;border-color:var(--accent)}
#chat .bk-in button{background:var(--accent);color:#fff;border-radius:7px;font-weight:600;padding:0 14px}
#chat .bk-note2{color:var(--faint)}

/* settings: slides over the channel */
.side{display:none;position:absolute;z-index:12;top:0;right:0;bottom:0;width:min(400px,100%);flex-direction:column;background:var(--p1);border-left:1px solid var(--line2);box-shadow:-18px 0 50px rgba(0,0,0,.45)}
.app.side-open .side{display:flex}
.side-close{display:block!important;align-self:flex-end;margin:8px 8px 0;border-radius:5px!important;font-size:12px!important}
.tabs{padding:4px 10px 8px;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{font-size:12.5px;padding:4px 9px;border-radius:5px;color:var(--mute)}
.tabs button:hover{background:var(--hover)}.tabs button[aria-selected=true]{background:var(--p3);color:var(--ink)}
.view{padding:16px}
.sec,.row{border-color:var(--line)}
h3{font-size:13.5px;font-weight:600;color:#ececee}.sub{color:var(--mute);line-height:1.6}
label{color:var(--mute)}
input,textarea,select{background:var(--p2);border:1px solid var(--line2);border-radius:6px;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border-radius:6px;font-weight:600}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--mute);font-weight:400}
.chip{background:var(--p3);color:var(--mute);border-radius:4px}
.bar{background:var(--p3)}
.grade button{border-color:var(--line2);border-radius:5px}
.savings{border-color:var(--line2);background:var(--p2)}.savings b{color:var(--ink)}
details summary{color:var(--accent)}

/* status line */
.statusbar{display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 12px;background:var(--p1);border-top:1px solid var(--line);font-size:11.5px;color:var(--faint)}
.statusbar span{display:flex;align-items:center;gap:6px}.statusbar i{width:6px;height:6px;border-radius:50%;background:var(--up)}
.statusbar .status-right{display:none}
.app.zen main{grid-template-columns:44px 248px minmax(0,1fr) 0}.app.zen #chat{visibility:hidden}.app.zen #focus-mode{color:var(--ink)}

/* search */
.command-dialog{width:min(560px,calc(100vw - 32px));padding:0;border:1px solid var(--line2);border-radius:10px;background:var(--p1);color:var(--ink);box-shadow:0 30px 90px rgba(0,0,0,.7)}
.command-dialog::backdrop{background:rgba(0,0,0,.5)}
.command-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.command-top input{flex:1;background:none;border:0;font-size:15px;padding:2px 0}.command-top input:focus{outline:none}
.command-top button{background:var(--p2);border:1px solid var(--line2);border-radius:4px;color:var(--mute);cursor:pointer;font-size:11px;padding:1px 6px}
.command-results{padding:6px;max-height:52vh;overflow:auto}
.command-results button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:6px;background:none;color:var(--ink);cursor:pointer;font-size:13px}
.command-results button:hover,.command-results button:focus{background:var(--sel);outline:none}
.command-results small{color:var(--faint)}
.command-hint{padding:8px 14px;color:var(--faint);font-size:11.5px;border-top:1px solid var(--line)}
#toast{background:var(--p2);border:1px solid var(--line2);border-radius:8px;color:var(--ink)}

@media(max-width:1200px){main{grid-template-columns:44px 210px minmax(0,1fr) 320px}.app.zen main{grid-template-columns:44px 210px minmax(0,1fr) 0}}
@media(max-width:1000px){main{grid-template-columns:44px minmax(0,1fr) 320px}.explorer{display:none}#graph{grid-column:2}#chat{grid-column:3}.app.zen main{grid-template-columns:44px minmax(0,1fr) 0}}
/* phones: the graph fills the screen; chat and settings are full sheets; tabs at the bottom */
.mtabs{display:none}
@media(max-width:760px){
  .app{grid-template-rows:44px minmax(0,1fr) 50px}
  main,.app.zen main{grid-template-columns:minmax(0,1fr)}
  #graph{grid-column:1}
  .rail,.explorer,.statusbar,.graph-foot{display:none}
  .brand>span:last-child{display:none}
  .pill:has(#ai-txt),.pill:has(#work-txt){display:none}.command kbd{display:none}
  .proj{max-width:150px}
  #graph{height:auto;min-height:0}
  #chat,.app.zen #chat{display:none}
  .app[data-m=chat] #chat{display:flex;visibility:visible;position:absolute;inset:0;z-index:4;height:auto;min-height:0;border:0}
  .app[data-m=side] .side,.app.side-open .side{display:flex;position:absolute;inset:0;width:auto;height:auto;min-height:0;border:0;box-shadow:none}
  .graph-modes{top:10px;right:10px}
  #graph .bk-zoom{right:10px;bottom:10px}

    function openNote(id) { const nt = (o.notes || []).find((x) => x.id === id); if (!nt) return;

    const api = {

      setActive(ids) { active.clear(); for (const id of ids || []) active.add(id); dirty = true; },
      pulse(a, b, color, loop = false) { const p = {a, b, t: 0, v: 0.018 + Math.random() * 0.01, color: color || byId.get(a)?.color || "#a68af9", loop}; pulses.push(p);

      reset() { for (const n of nodes) { n.pinned = false; n.userMoved = false; } if (o.layout === "solar") planSolar(); else build(); hl = null; dirty = true; setTimeout(fit, 30); },

        for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) { const a = nodes[i], b = nodes[j], fa = footprint(a), fb = footprint(b);
          const pad = 6 / (view.k || 1);   // the drawn shapes are smaller than their footprints; allow the spacing margin

  /* ---------- AI models: connectors + a chat panel ----------
   * An agent is {label, color, ask(messages, {onText, signal}) -> Promise<text>}; messages are [{role, content}].
   * Connectors make one:
   *   Brain.agents.claude(sample, {model:"claude-haiku-5-5"})       on a Claude page (sample = await claude.use("sample"))
   *   Brain.agents.openai({baseUrl, model, apiKey})                   any OpenAI-style API (DeepSeek, Gemini, OpenRouter, Ollama).
   *     Use it from your own server or a local app; never ship a real key inside a public web page.
   */
  const agents = {
    claude(sample, cfg = {}) {
      return async (messages, {onText, signal} = {}) => {
        const tier = cfg.modelTier || ({"claude-haiku-5-5": "quick", "claude-sonnet-5-5": "default"}[cfg.model] || "complex");
        const r = await sample(messages, {cache: false, model: cfg.model, modelTier: tier, signal, onText: onText ? ({text}) => onText(text) : undefined});
        return r.text;
      };
    },
    /* Firefly gateway (server/worker.js): keys stay on the server; it falls back to other AIs and counts usage.
     *   Brain.agents.gateway({url:"", passcode, model:"gemini:...", fallback:["cloudflare:..."]}) */
    gateway(cfg) {
      return async (messages, {signal} = {}) => {
        const res = await fetch(String(cfg.url || "").replace(/\/$/, "") + "/api/ask", {method: "POST", signal,
          headers: {"Content-Type": "application/json", Authorization: "Bearer " + (cfg.passcode || "")},
          body: JSON.stringify({model: cfg.model, fallback: cfg.fallback || [], messages, maxTokens: cfg.maxTokens || 1200})});
        let data = null; try { data = await res.json(); } catch (e) { data = null; }
        if (!res.ok) throw {code: data?.error || "HTTP " + res.status, tried: data?.tried};
        if (cfg.onAnswer) try { cfg.onAnswer(data); } catch (e) { /* display only */ }
        return data.text;
      };
    },
    openai(cfg) {
      return async (messages, {signal} = {}) => {
        const res = await fetch(cfg.baseUrl.replace(/\/$/, "") + "/chat/completions", {method: "POST", signal,
          headers: {"Content-Type": "application/json", ...(cfg.apiKey ? {Authorization: "Bearer " + cfg.apiKey} : {})},
          body: JSON.stringify({model: cfg.model, messages, max_tokens: cfg.maxTokens || 1200})});
        if (!res.ok) throw new Error("HTTP " + res.status);
        return (await res.json()).choices[0].message.content;
      };
    },
  };

  /* chat(el, brain, {from:{id,label,color}, hub:"lead", agents:{id:{label,color,role,ask}}, rules:"...", delegate:true})
   * You talk to any agent; the hub can hand up to 3 tasks to the others (lines "ASSIGN <id>: task"), whose reports come back. */
  function chat(el, brain, cfg) {
    el.classList.add("bk-chat");
    el.innerHTML = `<div class="bk-msgs" aria-live="polite"></div><div class="bk-to" role="group" aria-label="Talk to"></div>
      <form class="bk-in"><textarea rows="1" placeholder="Message…  (Enter to send)" aria-label="Message"></textarea><button type="submit">Send</button></form><div class="bk-note2"></div>`;
    const box = el.querySelector(".bk-msgs"), to = el.querySelector(".bk-to"), form = el.querySelector("form"), ta = el.querySelector("textarea"), send = form.querySelector("button"), note = el.querySelector(".bk-note2");
    let A = cfg.agents || {}, ids = Object.keys(A); const log = [];
    let target = cfg.hub && A[cfg.hub] ? cfg.hub : ids[0], ctl = null; const busy = new Set();
    const who = (id) => id === cfg.from?.id ? cfg.from : A[id];
    const nameOf = (m) => (who(m.from)?.label) || m.fromLabel || m.from;
    const keepIt = (m) => { if (cfg.store?.save && m.text && !m.wait) try { Promise.resolve(cfg.store.save({id: m.id, from: m.from, to: m.to || null, text: m.text.replace(/^\s*\**\s*(ASSIGN|TASK)\s+.*$/gim, "").trim(), tag: m.tag || "", at: m.at, fromLabel: nameOf(m), copy: !!m.copy})).catch(() => {}); } catch (e) {} };
    function add(from, text, extra = {}) { const m = {id: "m-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8), from, text, at: new Date().toISOString(), ...extra}; log.push(m); draw(); if (!m.wait) keepIt(m); return m; }
    function draw() {
      box.innerHTML = ""; if (!log.length) { box.innerHTML = `<div class="bk-welcome"><h2>What are we making?</h2><p>Start with “we're making…” and the crew splits it into jobs and works them in parallel. Quick questions get a free answer.</p><p>Or pick a crew member below to talk to them directly.</p></div>`; }
      for (const m of log.slice(-150)) { const w = (m.from === cfg.from?.id && m.fromLabel) ? {label: m.fromLabel, color: cfg.from.color} : who(m.from) || {label: m.fromLabel || m.from, color: "#888"}; const d = document.createElement("div");
        d.className = "bk-m" + (m.from === cfg.from?.id ? " you" : "") + (m.wait ? " wait" : "");
        d.innerHTML = `<i style="background:${esc(w.color)}"></i><div style="min-width:0"><b style="color:${esc(w.color)}">${esc(w.label)}</b><small>${esc(m.tag || "")}</small><div class="t"></div></div>`;
        d.querySelector(".t").textContent = (m.text || "").replace(/^\s*\**\s*(ASSIGN|TASK)\s+.*$/gim, "").replace(/\n{3,}/g, "\n\n").trim() || (m.wait ? "Thinking…" : "");   // dispatch lines are for JEV, not for reading
        if (m.copy) { const b = document.createElement("button"); b.type = "button"; b.textContent = "Copy"; b.style.cssText = "margin-top:6px;background:none;border:1px solid #3a3a3a;border-radius:5px;color:#ddd;padding:3px 9px;cursor:pointer;font:inherit;font-size:12px";
          b.onclick = async () => { try { await navigator.clipboard.writeText(m.text.replace(/^Copy this into [^:]+:\n\n/, "")); b.textContent = "Copied"; } catch (x) { const r = document.createRange(); r.selectNodeContents(d.querySelector(".t")); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(r); b.textContent = "Selected: Ctrl/Cmd+C"; } };
          d.querySelector(".t").after(b); }
        box.append(d); }
      box.scrollTop = box.scrollHeight;
    }
    function chips() { to.innerHTML = ""; for (const id of ids) { const b = document.createElement("button"); b.type = "button";
      b.setAttribute("aria-pressed", String(id === target)); b.innerHTML = `<i style="background:${esc(A[id].color)}"></i>@${esc(A[id].label)}`;
      b.onclick = () => { target = id; chips(); brain.focus(id); ta.focus(); }; to.append(b); } }
    const history = (id) => log.filter((m) => !m.wait && m.text && (m.from === id || m.to === id)).slice(-10)
      .map((m) => ({role: m.from === id ? "assistant" : "user", content: m.text}));
    async function run(id, prompt, tag, from) {
      const ag = A[id]; busy.add(id); brain.setActive([...busy]); const stop = brain.pulse(from || cfg.from?.id || cfg.hub, id, ag.color, true);
      const m = add(id, "", {wait: true, tag}); ctl = new AbortController(); send.textContent = "Stop";
      const sys = `You are ${ag.label}${ag.role ? ", " + ag.role : ""}, on a team led by ${A[cfg.hub]?.label || "the lead"}. ${cfg.rules || ""} Plain English, short.`;
      const msgs = [{role: "user", content: sys}, {role: "assistant", content: "Understood."}, ...history(id), {role: "user", content: prompt}];
      const t0 = Date.now(); let ok = true;
      try { if (ag.relay) { m.text = `Copy this into ${ag.label}:\n\n${sys}\n\n${prompt}\n\n(Paste its answer here with /reply)`; m.copy = true; m.tag = "copy into " + ag.label; }
        else m.text = await ag.ask(msgs, {signal: ctl.signal, onText: (t) => { m.text = t; m.wait = false; draw(); }});
        m.wait = false; m.to = from || cfg.from?.id; }
      catch (e) { ok = false; m.wait = false; m.text = (e?.text || "") + (e?.code === "cancelled" || e?.name === "AbortError" ? " (stopped)" : ` (couldn't reach ${ag.label}${e?.code ? ": " + e.code : ""})`); }
      finally { stop(); busy.delete(id); brain.setActive([...busy]); ctl = null; send.textContent = "Send"; draw(); keepIt(m);
        try { cfg.onRun && !ag.relay && cfg.onRun({id, ok, ms: Date.now() - t0}); } catch (x) {} }
      return ok ? m.text : "";
    }
    form.addEventListener("submit", async (e) => { e.preventDefault(); if (ctl) { ctl.abort(); return; }
      const text = ta.value.trim(); if (!text || !A[target]) return; ta.value = "";
      if (/^\/reply\s/i.test(text) && A[target].relay) { add(target, text.replace(/^\/reply\s+/i, ""), {to: cfg.from?.id, tag: "reply"}); cfg.onRun && cfg.onRun({id: target, ok: true, ms: 0}); return; }
      add(cfg.from?.id || "you", text, {to: target, tag: "to " + A[target].label});
      /* Quick lane: before the Lead spends anything, a simple question may be answered for free (no AI, a remembered
       * answer, or a free model). cfg.quick(text) -> {text, tag, label} or null to carry on as normal. */
      /* Kitchen: an order ("we're making ...") goes to the server's kitchen. cfg.order(text, update) -> true if taken;
       * update(text, tag) rewrites the kitchen's message in place as tickets cook. */
      if (target === cfg.hub && cfg.order) {
        const k = add("kitchen", "", {wait: true, fromLabel: "Kitchen"}); let took = false;
        const update = (t, tag, id) => { if (id) k.id = id; k.text = t; k.wait = false; if (tag) k.tag = tag; k.to = cfg.from?.id; draw(); keepIt(k); };   // id: one saved message per order
        try { took = await cfg.order(text, update); } catch (x) { took = false; }
        if (took) return;
        log.splice(log.indexOf(k), 1); draw();
      }
      if (target === cfg.hub && cfg.quick) {
        const q = add("quick", "", {wait: true, fromLabel: "Quick answer"}); let r = null;
        try { r = await cfg.quick(text); } catch (x) { r = null; }
        if (r?.text) { q.text = r.text; q.wait = false; q.tag = r.tag || ""; q.fromLabel = r.label || "Quick answer"; q.to = cfg.from?.id; draw(); keepIt(q); return; }
        log.splice(log.indexOf(q), 1); draw();
      }
      const D = cfg.dispatch;
      const roster = ids.filter((x) => x !== cfg.hub).map((x) => `${x} = ${A[x].label}${A[x].role ? ": " + A[x].role : ""}`).join("\n");
      const hand = target === cfg.hub && cfg.delegate !== false && roster
        ? (D ? `\n\nYou lead the team. Reshape this into clear, precise tasks. If any part should be done by the team, end with up to 3 lines exactly "TASK <kind>: <task>", where kind is one of: ${D.kinds.join(", ")}. The dispatcher (JEV) picks who does each one.`
             : `\n\nYou lead the team. If part of this is better done by a member, end with up to 3 lines exactly "ASSIGN <id>: <task>" using:\n${roster}`) : "";
      const out = await run(target, text + hand, "", cfg.from?.id);
      if (!hand || !out) return;
      const jobs = []; const clean = out.split("\n").filter((l) => {
        const t = l.match(/^\s*\**\s*TASK\s+([\w-]+)\s*\**\s*:\s*(.+)$/i), a = l.match(/^\s*\**\s*ASSIGN\s+@?([\w-]+)\s*\**\s*:\s*(.+)$/i);
        if (jobs.length >= 3 || !(t || a)) return !(t || a);
        const task = (t || a)[2].replace(/^[\s*]+|[\s*]+$/g, "");
        if (t && D) { const kind = t[1].toLowerCase(); const r = D.route(kind, task) || {}; if (A[r.id]) jobs.push({id: r.id, task, kind, why: r.reason || ""}); }
        else if (a && A[a[1]] && a[1] !== cfg.hub) jobs.push({id: a[1], task, kind: "", why: ""});
        return false; }).join("\n").trim();
      const last = log.filter((m) => m.from === cfg.hub).pop(); if (last) { last.text = clean + (jobs.length ? `\n\nHanding out: ${jobs.map((j) => A[j.id].label + (j.kind ? " (" + j.kind + ")" : "")).join(", ")}.` : ""); draw(); keepIt(last); }
      for (const j of jobs) {
        const res = await run(j.id, `Task from ${A[cfg.hub].label}: ${j.task}\n(The original request: ${text.slice(0, 400)})\nReport back in under 150 words.`, (D ? "JEV → " : "report to ") + (D ? (j.kind || "task") : A[cfg.hub].label), cfg.hub);
        try { cfg.onTask && cfg.onTask({member: j.id, kind: j.kind, task: j.task, why: j.why, text: res, request: text.slice(0, 400), relay: !!A[j.id].relay}); } catch (x) {} }
    });
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
    chips(); draw();
    if (cfg.store?.load) Promise.resolve(cfg.store.load()).then((old) => { if (Array.isArray(old) && old.length) { log.unshift(...old.filter((m) => m && m.text)); draw(); } }).catch(() => {});
    return {say: (text) => { ta.value = text; form.requestSubmit(); }, status: (t) => { note.textContent = t || ""; },
      setTarget: (id) => { if (!A[id]) return; target = id; chips(); ta.focus(); },
      setFrom: (f) => { Object.assign(cfg.from, f); draw(); }, clear: () => { log.length = 0; draw(); },
      setAgents: (next, hub) => { A = next || {}; ids = Object.keys(A); if (hub) cfg.hub = hub; if (!A[target]) target = cfg.hub && A[cfg.hub] ? cfg.hub : ids[0]; chips(); draw(); },
      replaceLog: (msgs) => { log.length = 0; log.push(...(msgs || []).filter((m) => m && m.text)); draw(); }, log};
  }

  /* store({url, passcode, project, fetch?, pollMs?}): the Firefly server's database (server/store.js) with the same
   * shape as the storage a Claude page uses: db.collection(name).add / doc(id).set|update|delete / orderBy / limit /
   * get / onSnapshot. Changes show at once on this page and reach the server in order; other devices appear on the
   * next poll. */
  function store(cfg) {
    const f = cfg.fetch || ((...a) => fetch(...a));
    const base = String(cfg.url || "").replace(/\/$/, "") + "/api/db/" + encodeURIComponent(cfg.project);
    const headers = {"Content-Type": "application/json", Authorization: "Bearer " + (cfg.passcode || "")};
    const data = new Map(), subs = new Set(), queue = new Map(), sigs = new Map();
    let loaded = null, timer = null, pending = 0;
    const col = (name) => { if (!data.has(name)) data.set(name, new Map()); return data.get(name); };
    const newId = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
    function snap(name, order, limit) {
      let rows = [...col(name).entries()];
      if (order) rows.sort((a, b) => { const x = String(a[1][order.field] ?? ""), y = String(b[1][order.field] ?? ""); return order.dir === "desc" ? y.localeCompare(x) : x.localeCompare(y); });
      if (limit) rows = rows.slice(0, limit);
      return {docs: rows.map(([id, d]) => ({id, data: () => ({...d})})), size: rows.length, empty: !rows.length};
    }
    const tell = (name) => { for (const s of subs) if (!name || s.name === name) try { s.cb(snap(s.name, s.order, s.limit)); } catch (e) { /* a broken listener must not stop others */ } };
    async function load() {
      const r = await f(base, {headers});
      if (!r.ok) { let e = null; try { e = await r.json(); } catch (x) { e = null; } throw {code: e?.error || "HTTP " + r.status, status: r.status}; }
      const body = await r.json();
      if (pending) return;                     // don't overwrite changes still on their way to the server
      const changed = [];
      for (const [name, docs] of Object.entries(body.collections || {})) {
        const m = new Map(); for (const d of docs) m.set(d.id, d.data);
        const sig = sigOf(m);
        if (sigs.get(name) !== sig || !data.has(name)) { sigs.set(name, sig); data.set(name, m); changed.push(name); }
      }
      for (const name of changed) tell(name);   // only redraw what changed, so a half-typed form survives a poll
    }
    const ready = () => loaded || (loaded = load());
    function send(name, op, id, d) {
      pending++;
      const prev = queue.get(name) || Promise.resolve();
      const next = prev.catch(() => {}).then(async () => {
        const r = await f(base + "/" + encodeURIComponent(name), {method: "POST", headers, body: JSON.stringify({op, id, data: d})});
        if (!r.ok) { let e = null; try { e = await r.json(); } catch (x) { e = null; } throw {code: e?.error || "HTTP " + r.status}; }
        return r.json();
      }).finally(() => { pending--; });
      queue.set(name, next);
      next.catch(() => { if (cfg.onError) cfg.onError(name); loaded = null; ready().catch(() => {}); });
      return next;
    }
    function query(name, order, limit) {
      return {
        orderBy: (field, dir = "asc") => query(name, {field, dir}, limit),
        limit: (n) => query(name, order, n),
        get: async () => { await ready(); return snap(name, order, limit); },
        onSnapshot(cb, err) { const s = {name, order, limit, cb}; subs.add(s); ready().then(() => cb(snap(name, order, limit))).catch((e) => err && err(e)); return () => subs.delete(s); },
      };
    }
    const sigOf = (m) => JSON.stringify([...m.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1)));
    const touched = (name) => { sigs.set(name, sigOf(col(name))); tell(name); };   // a change made here: redraw now; the next poll won't count it again
    function collection(name) {
      return Object.assign(query(name), {
        async add(d) { const id = newId(); col(name).set(id, {...d}); touched(name); await send(name, "set", id, d); return {id}; },
        doc: (id) => ({
          id,

function agents() {

    const role = `${m.job || ""}${skills.length ? "\nYour skills:\n" + skills.map((s) => `- ${s.name}: ${s.text}`).join("\n") : ""}\nShared memory (team notes):\n${S.notes.map((n) => `## ${n.id}\n${(n.text || "").slice(0, 700)}`).join("\n").slice(0, 3500)}`;

      ask: async (msgs, o) => {

          const chain = chainFor(model); if (!chain.length) throw {code: "no AIs listed for " + model};
          return Brain.agents.gateway({url: GW.url, passcode: GW.pass, model: chain[0], fallback: chain.slice(1),

  const mark = {done: "✓", cooking: "…", queued: "·", held: "?", failed: "✗", cancelled: "–"};
  const list = o.tickets.map((t) => `${mark[t.status] || "·"} ${t.id}. ${t.task} — ${name(t.member)}${t.size === "hard" ? " (hard)" : ""}${t.passedUp ? " (passed up)" : ""}`).join("\n");

  if (o.status === "cooking") return `Cooking ${o.title}: ${n("done")} of ${total} tickets done${n("cooking") ? `, ${n("cooking")} on the stove` : ""}.\n\n${list}${ask}`;

/* The Critic suggests improvements to Firefly itself; they're appended to the "Improving Firefly" note. */
async function askIdeas(btn) {

  if (!A) return toast("No team member to ask.");

    const prompt = `You are ${critic.name}. ${critic.job}\nFirefly is a space where many AIs work together: free models do easy work, paid models hard work, JEV routes tasks by rules, notes are an Obsidian vault, the owner approves every change.\nCurrent notes:\n${S.notes.map((n) => "## " + n.id + "\n" + (n.text || "").slice(0, 500)).join("\n").slice(0, 3000)}\n\nSuggest exactly three concrete improvements to Firefly itself. One line each, starting with "- ", plain English, each with why it matters.`;

}
/* Redraws must never eat typing: keep any changed field (by id) and the cursor when a view is redrawn. */
function keepTyping(view, draw) {
  const el = typeof view === "string" ? $(view) : view; if (!el) return draw();
  const fresh = Date.now() - (S.submittedAt || 0) < 4000;
  const kept = fresh ? [] : [...el.querySelectorAll("input[id],textarea[id],select[id]")].filter((x) => x.type !== "file" && x.value !== x.defaultValue && !(x.tagName === "SELECT"))
    .map((x) => ({id: x.id, value: x.value}));
  const f = document.activeElement && el.contains(document.activeElement) ? {id: document.activeElement.id, s: document.activeElement.selectionStart, e: document.activeElement.selectionEnd} : null;
  draw();
  for (const k of kept) { const x = $(k.id); if (x && el.contains(x) && !x.disabled) x.value = k.value; }
  if (f?.id) { const x = $(f.id); if (x) { x.focus(); try { if (f.s != null) x.setSelectionRange(f.s, f.e); } catch (e) { /* not a text field */ } } }

$('signal-demo').onclick=()=>{for(const m of S.members)brain.pulse(hubId(),m.id,m.color);brain.burst(hubId());};

document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));
$('focus-mode').onclick=()=>{const on=$('app').classList.toggle('zen');$('focus-mode').setAttribute('aria-pressed',String(on));requestAnimationFrame(()=>brain.fit());};
$('rail-graph').onclick=()=>{$('app').classList.remove('side-open');brain.fit();};
document.querySelectorAll('[data-lens]').forEach(b=>b.onclick=()=>{graphMode=b.dataset.lens;document.querySelectorAll('[data-lens]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));graph();requestAnimationFrame(()=>brain.fit());});
/* ---------- load ---------- */
renderAll();
function aiPill() { const on = !!sample || gwOn(); $("ai-dot").className = "dot " + (on ? "on" : "warn");
  $("ai-txt").textContent = sample && gwOn() ? "Claude + Firefly" : sample ? "Claude" : gwOn() ? "Firefly" : "off"; }
async function gwStatus() {
  if (!gwOn()) { GW.status = null; renderModels(); return; }
  try { const r = await fetch(GW.url.replace(/\/$/, "") + "/api/status", {headers: {Authorization: "Bearer " + GW.pass}});
    GW.status = r.ok ? await r.json() : {error: r.status === 401 ? "Wrong passcode." : r.status === 503 ? "The server has no passcode set yet." : "Couldn't reach the server (" + r.status + ")."}; }
  catch (e) { GW.status = {error: "Couldn't reach the Firefly server" + (GW.url ? " at " + GW.url : "") + "."}; }
  renderModels(); }
sampleP.then((s) => { sample = s; aiPill(); });
/* ---------- storage: Claude's own (inside Claude) or the Firefly server's database (on Cloudflare) ---------- */
function attach() {
  const live = (col, key, map) => db.collection(col).onSnapshot((snap) => { S[key] = snap.docs.map((d) => ({...d.data(), _id: d.id})); if (map) map(); renderAll(); }, () => {});
  live("members", "members", () => S.members.sort((a, b) => (b.hub ? 1 : 0) - (a.hub ? 1 : 0) || (a.at || "").localeCompare(b.at || "")));
  live("skills", "skills"); live("notes", "notes", () => S.notes.sort((a, b) => a.id === "Home" ? -1 : b.id === "Home" ? 1 : a.id.localeCompare(b.id)));
  db.collection("tasks").orderBy("at", "desc").limit(200).onSnapshot((snap) => { S.tasks = snap.docs.map((d) => ({...d.data(), _id: d.id}));
    const run = new Set(S.tasks.filter((t) => t.status === "waiting").map((t) => t.member)); $("work-txt").textContent = run.size ? run.size + " waiting" : "–"; renderAll(); }, () => {});
  db.collection("usage").orderBy("at", "desc").limit(1000).onSnapshot((snap) => { S.usage = snap.docs.map((d) => d.data()); renderModels(); }, () => {});
  db.collection("config").onSnapshot((snap) => { for (const d of snap.docs) { if (d.id === "jev") S.jev = d.data(); if (d.id === "project") S.project = {...S.project, ...d.data()}; } renderAll(); }, () => {});
  db.collection("chat").orderBy("at", "desc").limit(150).get().then((snap) => talk.replaceLog(snap.docs.map((d) => d.data()).reverse())).catch(() => {});
}
const PROJECT_ID = /^[a-z0-9][a-z0-9-]{0,39}$/;
function currentProject() { let p = "firefly"; try { p = localStorage.getItem("firefly-project") || p; } catch (e) { /* default */ } return PROJECT_ID.test(p) ? p : "firefly"; }
function switchProject(id) { try { localStorage.setItem("firefly-project", id); } catch (e) { /* this visit only */ } location.reload(); }
async function loadProjects() {
  if (!S.server) return;
  try { const r = await fetch(GW.url.replace(/\/$/, "") + "/api/projects", {headers: {Authorization: "Bearer " + GW.pass}});
    if (r.ok) { S.projects = (await r.json()).projects || []; renderProjects(); } } catch (e) { /* list stays as it was */ }
}
function renderProjects() {
  const el = $("proj"); if (!el) return; el.hidden = !S.server;
  const list = [...(S.projects || [])]; if (!list.some((p) => p.id === S.projectId)) list.unshift({id: S.projectId, name: S.project.name || S.projectId});
  el.innerHTML = list.map((p) => `<option value="${esc(p.id)}"${p.id === S.projectId ? " selected" : ""}>${esc(p.name || p.id)}</option>`).join("") + '<option value="+">+ New project…</option>';
}
$("proj").addEventListener("change", (e) => {
  const v = e.target.value;
  if (v !== "+") return switchProject(v);
  const name = (prompt("Name of the new project?") || "").trim(); if (!name) { renderProjects(); return; }
  const id = slug(name).slice(0, 40); if (!PROJECT_ID.test(id)) { renderProjects(); return; }
  try { localStorage.setItem("firefly-new-name", name); } catch (x) { /* falls back to the id */ }
  switchProject(id);
});

(async () => {
  const claude = window.claude;
  if (!claude?.use) {
    let d = null; try { const r = await fetch("brain-data.json", {cache: "no-store"}); if (r.ok) d = await r.json(); } catch (e) { d = null; }
    const pick = (x, y) => Array.isArray(x) && x.length ? x : y;
    // The repo's team and vault are what a new project starts with.
    STARTER.members = pick(d?.members, STARTER.members); STARTER.skills = pick(d?.skills, STARTER.skills); STARTER.notes = pick(d?.notes, STARTER.notes);
    if (d?.jev) STARTER.jev = d.jev;
    S.jev = STARTER.jev; loadAi(d?.ai); S.standalone = true; aiPill();
    if (gwOn()) {
      S.projectId = currentProject();
      const store = Brain.store({url: GW.url, passcode: GW.pass, project: S.projectId, pollMs: 30000, onError: () => toast("A change didn't save: reloaded from the server.")});
      try {
        await store.ready(); db = store; S.server = true; S.canEdit = true;
        const empty = (await db.collection("members").get()).empty;
        if (empty) { let name = ""; try { name = localStorage.getItem("firefly-new-name") || ""; localStorage.removeItem("firefly-new-name"); } catch (e) { /* none */ }
          await setupStarter(); await db.collection("config").doc("project").set({...S.project, name: name || (S.projectId === "firefly" ? "Firefly" : S.projectId)}); }
        attach(); gwStatus(); loadProjects(); renderProjects(); return;
      } catch (e) { GW.memoryError = e?.status === 401 ? "Wrong passcode." : e?.status === 503 ? "The server's memory isn't connected yet." : "Couldn't load this project from the server."; }
    }
    S.members = STARTER.members.map((m) => ({...m, _id: m.id})).sort((a, b) => (b.hub ? 1 : 0) - (a.hub ? 1 : 0));
    S.skills = STARTER.skills.map((x) => ({...x, _id: x.id}));
    S.notes = STARTER.notes.map((n) => ({...n, _id: slug(n.id)})).sort((a, b) => a.id === "Home" ? -1 : b.id === "Home" ? 1 : a.id.localeCompare(b.id));
    S.canEdit = false;
    try { talk.replaceLog(JSON.parse(localStorage.getItem("firefly-chat") || "[]")); } catch (e) { /* nothing saved */ }
    gwStatus(); renderAll(); return; }
  db = await claude.use("db");
  const u = await claude.use("user").catch(() => null);
  if (u) { const [owner, edit, id, me] = await Promise.all([u.isOwner(), u.canEdit(), u.id().catch(() => null), u.me().catch(() => null)]);
    S.me = {owner: !!owner, id, name: me?.name || ""}; S.canEdit = !!(edit || owner); talk.setFrom({label: me?.name || "You"});
    if (owner && me?.name) S.project.owner = me.name; }
  if (!db) { S.canEdit = false; renderAll(); return; }
  attach();
})();
})();
</script>
